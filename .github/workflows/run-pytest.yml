name: Run pytest

# Enhancement: path filters reduce unnecessary CI runs.
# Doc-only pushes (Test Plan / AI declaration) do not start a runner.
# Relevant code, tests, deps, or this workflow still trigger tests.
on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/run-pytest.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -v
